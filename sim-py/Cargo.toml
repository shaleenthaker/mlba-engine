[package]
name = "mlba-sim-py"
description = "Python bindings for the MLBA simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mlba_sim"
crate-type = ["cdylib"]

[dependencies]
mlba-sim = { path = "../sim" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }
